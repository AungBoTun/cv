<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <style>
    .text-main {
      fill: #2D2F33;
      font-family: "Segoe UI", "Helvetica", "Arial", sans-serif;
      font-weight: bold;
    }
  </style>

  <!-- White Background -->
  <rect width="100%" height="100%" fill="white" />

  <!-- Infinity Symbol -->
  <path d="M80,150 
           C50,150 50,100 80,100 
           C110,100 150,200 180,200 
           C210,200 210,150 180,150 
           C150,150 110,50 80,50 
           C50,50 50,100 80,100" 
        fill="none" stroke="#007BFF" stroke-width="20" />

  <!-- AI Chip -->
  <g>
    <!-- Chip base -->
    <rect x="160" y="70" width="50" height="50" rx="6" fill="white" stroke="#2D2F33" stroke-width="3"/>
    
    <!-- Chip lines -->
    <g stroke="#007BFF" stroke-width="3">
      <line x1="185" y1="65" x2="185" y2="55"/>
      <line x1="195" y1="65" x2="195" y2="55"/>
      <line x1="205" y1="65" x2="205" y2="55"/>
      <line x1="160" y1="85" x2="150" y2="85"/>
      <line x1="160" y1="95" x2="150" y2="95"/>
      <line x1="160" y1="105" x2="150" y2="105"/>
      <line x1="210" y1="85" x2="220" y2="85"/>
      <line x1="210" y1="95" x2="220" y2="95"/>
      <line x1="210" y1="105" x2="220" y2="105"/>
      <line x1="185" y1="120" x2="185" y2="130"/>
      <line x1="195" y1="120" x2="195" y2="130"/>
      <line x1="205" y1="120" x2="205" y2="130"/>
    </g>

    <!-- AI Text -->
    <text x="185" y="100" text-anchor="middle" dominant-baseline="middle" font-size="18" fill="#007BFF" font-weight="bold">AI</text>
  </g>

  <!-- Text: DevOps + AI -->
  <text x="50" y="260" font-size="24" class="text-main">DevOps + AI</text>

  <!-- Text: Platform Engineering -->
  <text x="50" y="290" font-size="20" class="text-main">Platform Engineering</text>
</svg>
